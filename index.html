<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCUSBLOOM</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="header-container">
        <h1>FOCUSBLOOM</h1>
        <nav>
          <ul>
            <li>Home</li>
            <li>Tasks</li>
            <li>Growth</li>
            <li>Profile</li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="dashboard">
        <section class="pomodoro">
          <h2>FOCUS TIME</h2>
          <p>25:00</p>
          <div class="buttons">
            <button>Iniciar</button>
            <button>Pausar</button>
            <button>Continuar</button>
          </div>
        </section>

        <section class="tasks">
          <h2>Tasks</h2>
          <div class="tasks-controls">
            <input type="text" placeholder="Matéria da sessão" />
            <button>Adicionar</button>
          </div>
        </section>
      </div>

      <div class="webcam">
            <video src="autoplay playsinline muted""></video>
          </div>

    </main>
  </body>
</html>
