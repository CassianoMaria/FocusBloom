<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FOCUSBLOOM</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./assets/img/favicon-32x32" sizes="32x32">
  </head>
  <body>
    <header>
      <div class="header-container">
        <h1 class="logo">
          <img src="./assets/img/logo3.png" alt="Logo" class="logo-img">
          <span class="text-focus">FOCUS</span> <span class="text-bloom">BLOOM</span>
        </h1>
        <nav>
          <ul>
            <li>Home</li>
            <li>Tasks</li>
            <li>Growth</li>
            <li>Profile</li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="dashboard">
        <section class="pomodoro">
          <h2>FOCUS TIME</h2>
          <p id="timer">25:00</p>
          <div class="buttons">
            <button id="bnt-iniciar">Iniciar</button>
            <button id="bnt-pausar">Pausar</button>
            <button id="bnt-continuar">Continuar</button>
          </div>
        </section>

        <section class="tasks">
          <h2>Tasks</h2>
          <div class="tasks-controls">
            <input type="text" placeholder="Matéria da sessão" />
            <button>Adicionar</button>
          </div>
        </section>
      </div>

      <div class="webcam">
            <video src="autoplay playsinline muted""></video>
          </div>

    </main>
    <script src="script.js"></script>
  </body>
</html>
